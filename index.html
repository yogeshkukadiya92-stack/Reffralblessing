function heading(title,sub){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><span class="date">${new Intl.DateTimeFormat('en-IN',{dateStyle:'full'}).format(new Date())}</span></div>`}function navigate(p){page=p;document.querySelector('aside').classList.remove('open');document.getElementById('nav').innerHTML=Object.keys(icons).map(n=>`<button class="${p===n?'active':''}" onclick="navigate('${n}')" ${p===n?'aria-current="page"':''}>${icon(n)}${n}</button>`).join('');render();}function workshopRows(){return workshops.map((w,i)=>`<div class="workshop"><div class="art ${w.style}"></div><div class="workshop-info"><button class="workshop-title" onclick="location.href='/w/${w.slug}'">${w.name} ↗</button><div class="metadata">${w.date} &nbsp; · &nbsp; ${w.time} IST</div><span class="tag">+${w.points} Blessing Points per referral</span></div><button class="share-small" onclick="invite(${i})">Share ↗</button></div>`).join('')}function table(rows){return `<div class="tablewrap"><table><thead><tr><th>PERSON</th><th>WORKSHOP</th><th>STATUS</th><th>BLESSING POINTS</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="mini-avatar">${r[4]}</span>${r[0]}</td><td class="muted">${r[1]}</td><td><span class="status ${r[2]==='Pending'?'pending':''}">● ${r[2]}</span></td><td style="color:${r[2]==='Pending'?'#a4aca6':'#527d5c'}">${r[2]==='Pending'?'Pending':'+'+r[3]}</td></tr>`).join('')||'<tr><td colspan="4">No referrals to show.</td></tr>'}</tbody></table></div>`}function linkpanel(){return `<section class="panel link-panel"><h2>Your referral link</h2><p>A small share. A meaningful difference.<br>Invite someone to learn with you.</p><div class="linkfield"><input readonly aria-label="Your referral link" value="${master}"><button aria-label="Copy referral link" onclick="copy(master)">▢</button></div><button class="whatsapp" onclick="invite()">Share on WhatsApp ↗</button><p class="link-tip">Your link works for every active workshop.</p></section>`}function render(){let out='';if(page==='Overview')out=heading('Good things grow together.','Share a workshop. Make an impact. Earn something back.')+`<div class="grid"><section class="hero"><div class="orbit"></div><div class="orb"></div><h2>Your next reward starts with a conversation.</h2><p>Invite your people to something worthwhile.<br>We’ll take care of the rewards.</p><button class="primary" onclick="invite()">Invite a friend <span>↗</span></button></section><section class="panel balance"><div class="balance-top">Your Blessing Points balance <span class="coin">✦</span></div><div class="balance-number">${balance} <span>available Blessing Points</span></div><div class="progress"><span style="width:${Math.min(balance/150*100,100)}%"></span></div><p class="small">${Math.max(150-balance,0)} more Blessing Points to a VIP Workshop Pass</p><button class="textbtn" onclick="navigate('Rewards')">Explore rewards →</button></section></div><div class="stats">${[['Total referrals',String(referrals.length),''],['Confirmed',String(confirmed),''],['Pending',String(pending),''],['Blessing Points earned',String(earned),'']].map(s=>`<div class="stat"><div class="stat-label">${s[0]}</div><strong>${s[1]}</strong><small>${s[2]}</small></div>`).join('')}</div><div class="grid"><section class="panel"><div class="section-title"><h2>Upcoming workshops</h2><button onclick="navigate('Workshops')">View all ↗</button></div>${workshopRows()}</section>${linkpanel()}</div><section class="panel recent"><div class="section-title"><h2>Recent referrals</h2><button onclick="navigate('My referrals')">View all referrals ↗</button></div>${table(referrals.slice(0,3))}</section>`;if(page==='Workshops')out=heading('A little learning. A bigger circle.','Discover upcoming workshops and share one that feels right.')+`<div class="grid"><section class="panel">${workshopRows()}</section>${linkpanel()}</div>`;if(page==='My referrals')out=heading('People you brought along.','Track registrations and see when your Blessing Points are approved.')+`<div class="toolbar"><input id="search" placeholder="Search by workshop" aria-label="Search referrals" oninput="filter()"><select id="filter" aria-label="Filter by status" onchange="filter()"><option>All statuses</option><option>Confirmed</option><option>Pending</option></select></div><section class="panel" id="results">${table(referrals)}</section><p class="small" style="margin-top:16px">Names are hidden to protect participant privacy.</p>`;if(page==='Rewards')out=heading('Your impact has its perks.',`You have ${balance} available Blessing Points. Choose a little thank-you.`)+`<div class="reward-list">${[['Learning Toolkit',50,'A curated digital workbook for your next chapter.','▤'],['VIP Workshop Pass',150,'A seat at a special workshop, just for you.','✦'],['Community Mentor Session',250,'Make space for a one-to-one conversation.','☀']].map((r,i)=>`<section class="panel"><div class="reward-art" style="background:${['#f3e6d6','#e5eddf','#eae4f0'][i]}">${r[3]}</div><h2>${r[0]}</h2><p>${r[2]}</p><button class="primary" ${balance<r[1]?'disabled':''} onclick="location.href='/redeem?reward='+encodeURIComponent('${r[0]}')">${balance<r[1]?(r[1]-balance)+' more Blessing Points needed':'Request reward · '+r[1]+' Blessing Points'}</button></section>`).join('')}</div>${requests.length?`<section class="panel recent"><h2>Redemption requests</h2>${requests.map(r=>`<div class="workshop"><div class="workshop-info">${r.name}<p class="small">${r.points} Blessing Points reserved · ${r.date}</p></div><span class="status pending">${r.status}</span></div>`).join('')}</section>`:''}`;if(page==='Blessing Points history')out=heading('Your Blessing Points history','A clear view of what you earned, spent and have available.')+`<section class="panel"><div class="section-title"><h2>Available balance: ${balance} Blessing Points</h2></div><div class="tablewrap"><table><thead><tr><th>TRANSACTION</th><th>DATE</th><th>STATUS</th><th>BLESSING POINTS</th></tr></thead><tbody>${requests.map(r=>`<tr><td>${r.name}</td><td>${r.date}</td><td><span class="status pending">${r.status}</span></td><td>−${r.points}</td></tr>`).join('')}${referrals.filter(r=>r[2]==='Confirmed').map(r=>`<tr><td>${r[1]}</td><td>—</td><td><span class="status">Approved</span></td><td>+${r[3]}</td></tr>`).join('')||'<tr><td colspan="4">No approved transactions yet.</td></tr>'}</tbody></table></div></section>`;document.getElementById('content').innerHTML=out;}
function filter(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('filter').value;document.getElementById('results').innerHTML=table(referrals.filter(r=>(r[0]+' '+r[1]).toLowerCase().includes(q)&&(s==='All statuses'||r[2]===s)))}function modal(html){document.getElementById('modalbody').innerHTML=html;document.getElementById('modal').showModal()}function invite(i){shareLink=i===undefined?master:location.origin+'/w/'+workshops[i].slug+'?ref=YOGESH24';modal(`<h2>Good things are better shared.</h2><p>${i===undefined?'Invite a friend to explore our workshops.':workshops[i].name+' · '+workshops[i].date}<br>Share this link to track workshop registrations.</p><div class="linkfield"><input aria-label="Link to share" readonly value="${shareLink}"></div><button class="primary" onclick="copy(shareLink)">Copy link ▢</button><a class="whatsapp" style="text-align:center;text-decoration:none;margin-top:12px" href="https://wa.me/?text=${encodeURIComponent('Join me for a workshop! '+shareLink)}" target="_blank" rel="noopener">Open WhatsApp ↗</a>`)}async function copy(text){try{await navigator.clipboard.writeText(text);toast('Referral link copied. Ready to share!')}catch{toast('Select and copy the link from the field.')}}let timer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>el.classList.add('hidden'),3200)}function detail(i){let w=workshops[i];modal(`<div class="art ${w.style}" style="width:100%;height:140px;margin-bottom:22px"></div><h2>${w.name}</h2><p>${w.date} · ${w.time} IST<br>${w.type}<br><br>${i===0?'Understand yourself better through guided reflection and practical exercises.':'Build confidence in everyday conversations with practical listening and communication exercises.'}<br><br>Earn ${w.points} Blessing Points for each verified referral.</p><button class="primary" onclick="document.getElementById('modal').close();invite(${i})">Share function help(){modal('<h2>A small share goes a long way.</h2><p>1. Share your personal link.<br><br>2. A friend registers for a workshop.<br><br>3. After verification, Blessing Points move from pending to available.<br><br>4. Choose a reward and request redemption.</p><button class="primary" onclick="document.getElementById(\'modal\').close()">Got it →</button>')}function notifications(){modal(`<h2>Referral activity</h2><p>${confirmed} verified · ${pending} pending</p>`)}document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});navigate('Overview');
async function loadActivity() {
  try {
    const response=await fetch('/api/activity');
    if (!response.ok) throw new Error('Unable to load activity');
    const records=await response.json();
    referrals=records.map(record=>['Participant', record.workshop, record.verified?'Confirmed':'Pending', record.points, '•']);
    confirmed=records.filter(record=>record.verified).length;
    pending=records.length-confirmed;
    const claimsResponse=await fetch('/claims');
    if (!claimsResponse.ok) throw new Error('Cannot load rewards');
    requests=await claimsResponse.json();
    earned=records.reduce((total, record)=>total+(record.verified?record.points:0),0);
    balance=earned-requests.reduce((total, claim)=>total+claim.points,0);
    render();
  } catch {
